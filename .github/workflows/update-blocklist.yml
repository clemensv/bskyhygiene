name: Update Blocklist

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run bot heuristic scanner
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_API_KEY: ${{ secrets.BLUESKY_API_KEY }}
        run: |
          python scripts/heuristic.py \
            --identifier "$BLUESKY_HANDLE" \
            --app-password "$BLUESKY_API_KEY" \
            --output blocklists/blocklist.json \
            --threshold 0.45 \
            --clusters clusters.json

      - name: Generate summary
        run: |
          echo "## Blocklist Update $(date -u +%Y-%m-%d)" > blocklists/LATEST.md
          echo "" >> blocklists/LATEST.md
          TOTAL=$(jq '.metadata.total_flagged' blocklists/blocklist.json)
          HIGH=$(jq '[.accounts[] | select(.botScore >= 0.7)] | length' blocklists/blocklist.json)
          MEDIUM=$(jq '[.accounts[] | select(.botScore >= 0.45 and .botScore < 0.7)] | length' blocklists/blocklist.json)
          echo "| Metric | Count |" >> blocklists/LATEST.md
          echo "|--------|-------|" >> blocklists/LATEST.md
          echo "| Total flagged | $TOTAL |" >> blocklists/LATEST.md
          echo "| High score (≥0.7) | $HIGH |" >> blocklists/LATEST.md
          echo "| Medium score (0.45–0.7) | $MEDIUM |" >> blocklists/LATEST.md

      - name: Generate visualization cards
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_API_KEY: ${{ secrets.BLUESKY_API_KEY }}
        run: |
          python scripts/generate_cards.py \
            --identifier "$BLUESKY_HANDLE" \
            --app-password "$BLUESKY_API_KEY" \
            --blocklist blocklists/blocklist.json \
            --output-dir blocklists/assets \
            --sample-size 150

      - name: Sync to Bluesky moderation list
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_API_KEY: ${{ secrets.BLUESKY_API_KEY }}
        run: |
          python scripts/sync_modlist.py \
            --identifier "$BLUESKY_HANDLE" \
            --app-password "$BLUESKY_API_KEY" \
            --blocklist blocklists/blocklist.json \
            --list-name "Bot Infrastructure Blocklist"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklists/
          if git diff --cached --quiet; then
            echo "No changes to blocklist"
          else
            git commit -m "Update blocklist $(date -u +%Y-%m-%d)

          Scans: PDS clusters + description-rule matches (burst-follow, b-short ring)"
            git push
          fi
